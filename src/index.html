<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Expense Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Private, offline-first personal expense, income and loan tracker. Data stays on your device." />
    <meta name="theme-color" content="#1e2a63" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Expenses" />
    <link rel="icon" type="image/png" href="icons/icon-96x96.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint (see core/theme.ts).
      try {
        var d = document.documentElement.dataset, t = localStorage.getItem('theme'), a = localStorage.getItem('accent'), b = localStorage.getItem('bg');
        if (t === 'light' || t === 'dark') d.theme = t;
        if (a) d.accent = a;
        if (b) d.bg = b;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to use Expense Tracker.</noscript>
  </body>
</html>
