name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Project pages live under /<repo>/, so the app and its service worker need that base path.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - run: node scripts/ngsw-unpin-index.mjs
      # SPA fallback: GitHub Pages serves 404.html for unknown paths such as /loans.
      - run: |
          cp dist/expense-tracker/browser/index.html dist/expense-tracker/browser/404.html
          touch dist/expense-tracker/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/expense-tracker/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
